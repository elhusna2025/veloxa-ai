# Settings to manage and configure a Firebase App Hosting backend for Veloxa AI.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  maxInstances: 2
  minInstances: 0
  memory: 512Mi

env:
  - variable: NODE_OPTIONS
    value: --no-experimental-webstorage
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: veloxa-ai-saas
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyBIszLovRLEazQEmNQoy6w7kN6fLJ-WW3w
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: veloxa-ai-saas.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: veloxa-ai-saas.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "503587432700"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:503587432700:web:64ba9c80619a3692bccf79
    availability:
      - BUILD
      - RUNTIME
