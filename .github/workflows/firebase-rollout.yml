name: Validate Veloxa server and publishing

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm --prefix functions ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm --prefix functions audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run functions:test
      - name: Check deployed Functions entrypoint exists
        run: node -e "require('fs').accessSync('functions/' + require('./functions/package.json').main)"
      - run: npm run build
      - run: npm run typecheck

# The application now requires a Next.js server (Firebase App Hosting).
# Do not remove API routes or deploy the web app as static Firebase Hosting output.
# Production deployment and Meta credentials are configured separately.
