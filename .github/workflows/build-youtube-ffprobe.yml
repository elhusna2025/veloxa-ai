name: Build YouTube FFprobe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x64:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Verify signed source and build FFprobe
        run: bash scripts/build-youtube-ffprobe.sh "$RUNNER_TEMP/youtube-ffprobe"
      - name: Check rotations, pixel aspect ratio and WebM packet timing
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          cd "$RUNNER_TEMP/youtube-ffprobe"
          tar -xJf veloxa-ffprobe-9.1-linux-x64.tar.xz veloxa-ffprobe-9.1-linux-x64/ffprobe
          ffmpeg -v error -f lavfi -i 'color=c=black:s=24x32:r=1:d=4' -vf setsar=3/2 \
            -c:v libx264 -pix_fmt yuv420p source.mp4
          ffmpeg -v error -i source.mp4 -c copy -metadata:s:v:0 rotate=90 rotated.mp4
          ffmpeg -v error -i source.mp4 -c copy source.mov
          ffmpeg -v error -f lavfi -i 'color=c=black:s=24x32:r=1:d=4' \
            -c:v libvpx -live 1 -f webm pipe:1 > no-duration.webm
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess

          executable = "./veloxa-ffprobe-9.1-linux-x64/ffprobe"
          base = [executable, "-v", "error", "-max_alloc", "33554432", "-protocol_whitelist", "file"]

          def inspect(path, demuxer):
              drefs = ["-enable_drefs", "0"] if demuxer == "mov" else []
              return json.loads(subprocess.check_output([
                  *base, "-f", demuxer, *drefs, "-of", "json", "-show_entries",
                  "format=duration:stream=index,codec_type,width,height,duration,time_base,sample_aspect_ratio:stream_disposition=attached_pic:stream_tags=rotate:stream_side_data_list",
                  "-i", path,
              ], timeout=8))

          for path in ("source.mov", "rotated.mp4"):
              result = inspect(path, "mov")
              assert float(result["format"]["duration"]) == 4
              stream = result["streams"][0]
              assert (stream["width"], stream["height"], stream["sample_aspect_ratio"]) == (24, 32, "3:2")
              if path == "rotated.mp4":
                  assert any(abs(item.get("rotation", 0)) == 90 for item in stream["side_data_list"])

          webm = inspect("no-duration.webm", "matroska")
          assert webm["format"].get("duration") is None
          assert webm["streams"][0].get("duration") is None
          assert webm["streams"][0]["time_base"] == "1/1000"

          def packets(path):
              return subprocess.check_output([
                  *base, "-f", "matroska", "-nofind_stream_info", "-of", "csv=p=0", "-show_packets",
                  "-show_entries", "packet=stream_index,pts,duration:packet_side_data=", "-i", path,
              ], text=True, timeout=8).splitlines()

          assert packets("no-duration.webm") == [f"0,{n * 1000},1000" for n in range(4)]
          source = Path("no-duration.webm").read_bytes()
          default_duration = bytes.fromhex("23e383843b9aca00")
          assert source.count(default_duration) == 1
          Path("unknown-tail.webm").write_bytes(source.replace(default_duration, bytes.fromhex("ec86000000000000")))
          assert packets("unknown-tail.webm") == [f"0,{n * 1000},N/A" for n in range(4)]
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: veloxa-ffprobe-9.1-linux-x64
          path: |
            ${{ runner.temp }}/youtube-ffprobe/*.tar.xz
            ${{ runner.temp }}/youtube-ffprobe/*.tar.json
          if-no-files-found: error
          compression-level: 0
